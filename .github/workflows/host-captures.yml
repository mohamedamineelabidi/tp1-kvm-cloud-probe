name: Captures preparation KVM QEMU du TP1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  captures-hote:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Préparer le bureau virtuel et les paquets
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            cpu-checker imagemagick libvirt-clients libvirt-daemon-system \
            qemu-kvm qemu-system-gui qemu-system-x86 qemu-utils \
            x11-xserver-utils xterm xvfb
          mkdir -p captures

      - name: Exécuter les commandes et capturer chaque résultat
        shell: bash
        env:
          DISPLAY: :99
        run: |
          set -euo pipefail

          Xvfb :99 -screen 0 1600x900x24 >/tmp/xvfb.log 2>&1 &
          xvfb_pid=$!
          trap 'kill "$xvfb_pid" 2>/dev/null || true' EXIT

          for attempt in {1..20}; do
            if xdpyinfo -display :99 >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          xdpyinfo -display :99 >/dev/null
          xsetroot -display :99 -solid '#101418'

          capture() {
            local capture_id="$1"
            local title="$2"
            local command="$3"
            local script_file
            local done_file="/tmp/${capture_id}.done"
            local terminal_pid
            local wait_count=0

            script_file="$(mktemp)"
            rm -f "$done_file"
            {
              printf '#!/usr/bin/env bash\n'
              printf 'set +e\n'
              printf 'clear\n'
              printf 'printf "\\033[1;36mTP Virtualisation - %s\\033[0m\\n"\n' "$title"
              printf 'printf "Date UTC : %%s\\n\\n" "$(date -u +"%%Y-%%m-%%d %%H:%%M:%%S")"\n'
              printf 'printf "%%s\\n" %q\n' "runner@github:~$ $command"
              printf 'bash -lc %q\n' "$command"
              printf 'status=$?\n'
              printf 'printf "\\n[Code de sortie : %%s]\\n" "$status"\n'
              printf 'touch %q\n' "$done_file"
              printf 'sleep 8\n'
              printf 'exit "$status"\n'
            } >"$script_file"
            chmod +x "$script_file"

            xterm \
              -display :99 \
              -geometry 112x30+25+25 \
              -fa 'DejaVu Sans Mono' \
              -fs 14 \
              -bg '#101418' \
              -fg '#f2f2f2' \
              -title "$capture_id - $title" \
              -e "$script_file" &
            terminal_pid=$!

            until test -f "$done_file"; do
              sleep 1
              wait_count=$((wait_count + 1))
              if test "$wait_count" -ge 120; then
                echo "Délai dépassé pour $capture_id" >&2
                kill "$terminal_pid" 2>/dev/null || true
                return 1
              fi
            done

            import -display :99 -window root -quality 95 "captures/${capture_id}.png"
            kill "$terminal_pid" 2>/dev/null || true
            wait "$terminal_pid" 2>/dev/null || true
            rm -f "$script_file" "$done_file"
          }

          capture K01 'Extensions de virtualisation du processeur' \
            "grep -E -m1 -o '(vmx|svm)' /proc/cpuinfo"
          capture K02 'Disponibilité de KVM' \
            "kvm-ok; ls -l /dev/kvm"
          capture K03 'Installation de KVM et libvirt' \
            "sudo apt-get install -y qemu-kvm libvirt-clients libvirt-daemon-system"
          capture K04 'Modules KVM chargés' \
            "lsmod | grep -E '^kvm|^kvm_amd|^kvm_intel'"
          capture K05 'Création et contrôle du groupe kvm' \
            "sudo groupadd -f kvm; getent group kvm"
          capture K06 'Ajout de l’utilisateur au groupe kvm' \
            "sudo usermod -aG kvm \"$USER\"; id \"$USER\""
          capture K07 'Ajout de l’utilisateur au groupe libvirt' \
            "sudo groupadd -f libvirt; sudo usermod -aG libvirt \"$USER\"; getent group libvirt"
          capture K08 'Vérification des groupes de l’utilisateur' \
            "id \"$USER\""
          capture K09 'Création et droits du répertoire vservers' \
            "sudo mkdir -p /vservers; sudo chgrp kvm /vservers; sudo chmod 775 /vservers; stat -c '%A %U %G %n' /vservers"
          capture K10 'Contrôle final du répertoire vservers' \
            "ls -ld /vservers"
          capture Q01 'Installation de QEMU système et interface' \
            "sudo apt-get install -y qemu-system-x86 qemu-system-gui; qemu-system-x86_64 --version"
          capture Q02 'Installation des utilitaires QEMU' \
            "sudo apt-get install -y qemu-utils; qemu-img --version"

          identify captures/*.png

      - name: Publier les captures réelles
        uses: actions/upload-artifact@v4
        with:
          name: captures-preparation-kvm-qemu
          path: captures/*.png
          if-no-files-found: error
          retention-days: 1

